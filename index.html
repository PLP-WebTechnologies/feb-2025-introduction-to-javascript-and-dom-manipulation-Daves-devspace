<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript DOM Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>

  <header>
    <h1 id="main-title">Welcome to My Page</h1>
  </header>

  <main>
    <section>
      <article>
        <p id="info-text">Click the button to update this text.</p>
        <button onclick="changeText()">Change Text</button>
      </article>

      <article>
        <p>This box will change color.</p>
        <div id="color-box" style="width: 100px; height: 100px; background: coral;"></div>
        <button onclick="changeColor()">Change Color</button>
      </article>

      <article>
        <p>Click the button to add or remove a message.</p>
        <button onclick="toggleMessage()">Toggle Message</button>
        <div id="message-area"></div>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 DOM Demo</p>
  </footer>

</body>
</html>
